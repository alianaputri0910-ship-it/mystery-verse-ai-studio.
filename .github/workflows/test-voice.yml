
name: MYSTERY VERSE Voice Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-voice.yml"

jobs:
  generate-voice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install ArboTTS
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng libsndfile1
          git clone https://github.com/ARBO-TEAM/arboTTS.git /tmp/arbotts
          cd /tmp/arbotts

          python - <<'PY'
          from pathlib import Path
          p = Path("arbotts/__init__.py")
          s = p.read_text()
          s = s.replace(
              "from arbotts.clone import AutoClone, StudioClone, rewrite_indonesian_phonetics\n",
              ""
          )
          p.write_text(s)
          PY

          pip install --no-deps -e .
          pip install onnxruntime numpy soundfile
          pip install espeakng-loader phonemizer


      - name: Generate Bimo voice
        run: |
          mkdir -p output
          arbotts "Jangan pernah merasa sendirian ketika malam tiba. Karena bisa jadi, ada sesuatu yang sedang memperhatikanmu." -sp bimo -s 0.75 -l id -o output/bimo-test.wav

      - name: Verify audio
        run: |
          test -s output/bimo-test.wav
          file output/bimo-test.wav

      - name: Upload voice audio
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-bimo-voice
          path: output/bimo-test.wav
