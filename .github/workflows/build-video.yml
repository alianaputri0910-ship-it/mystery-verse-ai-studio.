name: MYSTERY VERSE Video Builder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-video.yml"
      - "scripts/generate-story.js"
      - "scripts/generate-images.js"
      - "scripts/render-vuza.py"
      - "video_engine.py"
      - "episodes/trunyan/short.json"
      - "package.json"
  workflow_dispatch:
    inputs:
      episode_slug:
        description: "Slug episode yang sudah memiliki naskah riset (contoh: trunyan)"
        required: true
        type: string
        default: "trunyan"

permissions:
  contents: read

concurrency:
  group: mystery-verse-video
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install VUZA video engine dependencies
        run: |
          python -m pip install --upgrade edge-tts 'moviepy>=2.0.0' 'Pillow>=10.0.0' 'numpy>=1.24.0'

      - name: Validate production scripts
        run: |
          node --check scripts/generate-story.js
          node --check scripts/generate-images.js
          python -m py_compile scripts/render-vuza.py video_engine.py

      - name: Validate and load Trunyan episode
        env:
          EPISODE_SLUG: ${{ inputs.episode_slug || 'trunyan' }}
        run: |
          npm run story -- "$EPISODE_SLUG"
          node -e "const s=require('./output/story.json'); if(s.slug!=='trunyan'||s.scenes.length!==8) process.exit(1); console.log('Episode:',s.slug,'scenes:',s.scenes.length)"

      - name: Generate AI images with Pollinations API
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: black-forest-labs/flux.1-schnell
        run: |
          node scripts/generate-images.js

      - name: Render Shorts with VUZA engine (40-75 seconds)
        run: |
          python scripts/render-vuza.py

      - name: Re-encode MP4 for Android compatibility
        run: |
          test -s output/mystery-verse.mp4
          ffmpeg -y -i output/mystery-verse.mp4 \
            -map 0:v:0 -map 0:a:0? \
            -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p -profile:v high -level:v 4.1 -r 30 \
            -c:a aac -b:a 192k -ac 2 \
            -movflags +faststart output/mystery-verse-android.mp4
          mv output/mystery-verse-android.mp4 output/mystery-verse.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -of default=noprint_wrappers=1 output/mystery-verse.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 output/mystery-verse.mp4
          ffmpeg -v error -i output/mystery-verse.mp4 -f null -

      - name: Upload verified Shorts production files
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-trunyan-shorts
          path: |
            output/mystery-verse.mp4
            output/thumbnail.jpg
            output/youtube-metadata.json
            output/story.json
            output/images/
          if-no-files-found: error
