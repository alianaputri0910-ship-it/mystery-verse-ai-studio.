
name: MYSTERY VERSE Video Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/**"
      - "config/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Edge TTS
        run: |
          python -m pip install --upgrade edge-tts

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate horror story
        run: |
          npm run story -- "Misteri Rumah Kosong"

      - name: Generate AI images
        run: |
          node scripts/generate-images.js

      - name: Generate ArdiNeural voice
        run: |
          npm run voice

      - name: Build storyboard and composition
        run: |
          npm run build

      - name: Render video
        run: |
          npx --yes hyperframes render \
            --output output/mystery-verse.mp4 \
            --fps 30 \
            --quality standard

      - name: Upload video and audio
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-production
          path: output/
          if-no-files-found: error
