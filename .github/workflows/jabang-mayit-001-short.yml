name: MYSTERY VERSE — Jabang Mayit Episode 001 Shorts

on:
  push:
    branches: [episode-001-jabang-mayit]
    paths:
      - "episodes/jabang-mayit-001/short.json"
      - "scripts/render-jabang-short.py"
      - ".github/workflows/jabang-mayit-001-short.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystery-verse-jabang-mayit-001
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout dedicated episode branch
        uses: actions/checkout@v4
        with:
          ref: episode-001-jabang-mayit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade edge-tts 'moviepy>=2.0.0' 'Pillow>=10.0.0' 'numpy>=1.24.0'

      - name: Validate episode and renderer
        run: |
          node --check scripts/generate-story.js
          node --check scripts/generate-images.js
          python -m py_compile scripts/render-jabang-short.py video_engine.py
          npm run story -- jabang-mayit-001
          node -e "const s=require('./output/story.json'); if(s.slug!=='jabang-mayit-001'||s.scenes.length!==8) process.exit(1); console.log('Validated:',s.title,'scenes:',s.scenes.length)"

      - name: Generate eight brand-new AI story visuals
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: black-forest-labs/flux.1-schnell
        run: node scripts/generate-images.js

      - name: Render vertical thriller short with a 2.4s black glitch title card and dedicated CTA outro
        run: python scripts/render-jabang-short.py

      - name: Encode and validate final MP4
        run: |
          test -s output/mystery-verse.mp4
          ffmpeg -y -i output/mystery-verse.mp4 -map 0:v:0 -map 0:a:0? -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -profile:v high -level:v 4.1 -r 30 -c:a aac -b:a 192k -ac 2 -movflags +faststart output/jabang-mayit-001-final.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,pix_fmt -of json output/jabang-mayit-001-final.mp4
          ffmpeg -v error -i output/jabang-mayit-001-final.mp4 -f null -

      - name: Upload Episode 001 final MP4 and production files
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-jabang-mayit-episode-001
          path: |
            output/jabang-mayit-001-final.mp4
            output/thumbnail.jpg
            output/youtube-metadata.json
            output/story.json
            output/images/
          if-no-files-found: error
