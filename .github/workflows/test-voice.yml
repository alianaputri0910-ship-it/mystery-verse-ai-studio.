
name: MYSTERY VERSE Voice Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-voice.yml"

jobs:
  generate-voice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install ArboTTS
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng libsndfile1
          git clone https://github.com/ARBO-TEAM/arboTTS.git /tmp/arbotts
          cd /tmp/arbotts

          python - <<'PY'
          from pathlib import Path
          p = Path("arbotts/__init__.py")
          s = p.read_text()
          s = s.replace(
              "from arbotts.clone import AutoClone, StudioClone, rewrite_indonesian_phonetics\n",
              ""
          )
          p.write_text(s)
          PY

          pip install --no-deps -e .
          pip install onnxruntime numpy soundfile scipy librosa edge-tts huggingface-hub
          pip install espeakng-loader phonemizer


      
      - name: Generate Voice Comparison
        run: |
          mkdir -p output

          arbotts "Jujur, ada satu hal yang sampai sekarang masih bikin orang bertanya-tanya. Bagaimana mungkin dua orang bisa menghilang begitu saja, padahal sebelumnya mereka terlihat baik-baik saja? Dan yang lebih aneh, tidak ada satu pun orang yang tahu apa yang sebenarnya terjadi." -sp bimo -s 1.00 -l id -o output/bimo-test.wav

          arbotts "Jujur, ada satu hal yang sampai sekarang masih bikin orang bertanya-tanya. Bagaimana mungkin dua orang bisa menghilang begitu saja, padahal sebelumnya mereka terlihat baik-baik saja? Dan yang lebih aneh, tidak ada satu pun orang yang tahu apa yang sebenarnya terjadi." -sp danu -s 1.00 -l id -o output/danu-test.wav

        run: |
          mkdir -p output
          arbotts "Jangan pernah merasa sendirian ketika malam tiba. Karena bisa jadi, ada sesuatu yang sedang memperhatikanmu." -sp bimo -s 1.00 -l id -o output/bimo-test.wav
      - name: Verify audio
        run: |
          test -s output/bimo-test.wav
          file output/bimo-test.wav

     
      - name: Upload Voice Comparison
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-voice-comparison
          path: output/*.wav

