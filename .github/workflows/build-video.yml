name: MYSTERY VERSE Video Builder

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topik cerita horor (kosongkan untuk topik default)"
        required: false
        type: string
        default: "Tiga Penjaga Mercusuar Menghilang — Misteri Flannan Isles (1900)"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/**"
      - "config/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: mystery-verse-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install VUZA video engine dependencies
        run: |
          python -m pip install --upgrade edge-tts 'moviepy>=2.0.0' 'Pillow>=10.0.0' 'numpy>=1.24.0'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate horror story
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          if [ -z "$TOPIC" ]; then
            TOPIC="Tiga Penjaga Mercusuar Menghilang — Misteri Flannan Isles (1900)"
          fi
          npm run story -- "$TOPIC"

      - name: Generate AI images with Pollinations API
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: black-forest-labs/flux.1-schnell
        run: |
          node scripts/generate-images.js

      - name: Render with VUZA engine (40-60 second Shorts)
        run: |
          python scripts/render-vuza.py

      - name: Upload video and production files
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-production
          path: output/
          if-no-files-found: error
