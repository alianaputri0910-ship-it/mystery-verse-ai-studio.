name: MYSTERY VERSE — Episode 004 Offline Visual + FFmpeg

on:
  push:
    branches: [episode-004-jabang-mayit]
    paths:
      - "episodes/jabang-mayit-004/short.json"
      - "scripts/render-jabang-short-004.py"
      - "scripts/generate-visuals-local.py"
      - ".github/workflows/jabang-mayit-004-short.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystery-verse-jabang-mayit-004
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Episode 004 branch
        uses: actions/checkout@v4
        with:
          ref: episode-004-jabang-mayit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade edge-tts 'moviepy>=2.0.0' 'Pillow>=10.0.0' 'numpy>=1.24.0'

      - name: Validate episode and renderer
        run: |
          node --check scripts/generate-story.js
          python -m py_compile scripts/render-jabang-short-004.py video_engine.py
          npm run story -- jabang-mayit-004
          node -e "const s=require('./output/story.json'); if(s.slug!=='jabang-mayit-004'||s.scenes.length!==8) process.exit(1); console.log('Validated:',s.title,'scenes:',s.scenes.length)"

      - name: Generate eight offline illustrated story visuals
        run: python scripts/generate-visuals-local.py

      - name: Render POV storytelling Shorts (40–119 seconds)
        run: python scripts/render-jabang-short-004.py

      - name: Encode and validate final MP4
        run: |
          test -s output/mystery-verse.mp4
          ffmpeg -y -i output/mystery-verse.mp4 -map 0:v:0 -map 0:a:0? -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -profile:v high -level:v 4.1 -r 30 -c:a aac -b:a 192k -ac 2 -movflags +faststart output/jabang-mayit-004-final.mp4
          python - <<'PY'
          import json, subprocess
          path = "output/jabang-mayit-004-final.mp4"
          data = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", path
          ], text=True))
          video = next((s for s in data["streams"] if s["codec_type"] == "video"), None)
          audio = next((s for s in data["streams"] if s["codec_type"] == "audio"), None)
          duration = float(data["format"]["duration"])
          assert video is not None, "Video stream tidak ditemukan"
          assert (video["width"], video["height"]) == (1080, 1920), f"Resolusi salah: {video.get('width')}x{video.get('height')}"
          assert video.get("avg_frame_rate") == "30/1", f"Frame rate bukan 30 FPS: {video.get('avg_frame_rate')}"
          assert audio is not None, "Audio stream tidak ditemukan"
          assert 40 <= duration <= 179, f"Durasi Shorts di luar 40–179 detik: {duration:.2f}s"
          print(f"FFmpeg QC PASS: {duration:.2f}s | 1080x1920 | 30 FPS | audio {audio['codec_name']}")
          PY
          ffmpeg -v error -i output/jabang-mayit-004-final.mp4 -f null -

      - name: Upload Episode 004 MP4 and production files
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-jabang-mayit-episode-004
          path: |
            output/jabang-mayit-004-final.mp4
            output/thumbnail.jpg
            output/youtube-metadata.json
            output/story.json
            output/images/
            output/motion/
            output/character-references/
          if-no-files-found: error
