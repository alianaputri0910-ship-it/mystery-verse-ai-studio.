name: MYSTERY VERSE Long-form Builder

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MYSTERY VERSE Video Builder"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mystery-verse-longform
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm successful Shorts revision is included in current main
        if: github.event_name == 'workflow_run'
        env:
          SHORTS_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          echo "Shorts revision: $SHORTS_SHA"
          echo "Current main:    $CURRENT_MAIN"
          git merge-base --is-ancestor "$SHORTS_SHA" "$CURRENT_MAIN" || {
            echo "Successful Shorts revision is not included in current main."
            exit 1
          }
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure FFmpeg and fonts are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          if ! fc-match "DejaVu Sans" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
          fc-match "DejaVu Sans" | head -n 1
      - name: Install voice dependencies
        run: python -m pip install --upgrade edge-tts
      - name: Generate widescreen episode visuals
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: black-forest-labs/flux.1-schnell
        run: node scripts/generate-longform-images.js
      - name: Render long-form documentary
        run: python scripts/render-longform.py
      - name: Validate final MP4
        run: |
          test -s output/mystery-verse-trunyan-longform.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt -show_entries format=duration -of default=noprint_wrappers=1 output/mystery-verse-trunyan-longform.mp4
          ffmpeg -v error -i output/mystery-verse-trunyan-longform.mp4 -f null -
      - name: Upload long-form production files
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-trunyan-longform
          path: output/
          if-no-files-found: error
