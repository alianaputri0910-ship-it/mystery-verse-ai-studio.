
name: MYSTERY VERSE Voice Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-voice.yml"

jobs:
  generate-voice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Edge TTS
        run: |
          pip install edge-tts

      - name: Generate Clean Indonesian Voice
        run: |
          mkdir -p output
          edge-tts \
            --voice id-ID-ArdiNeural \
            --rate +0% \
            --volume +0% \
            --text "Jujur, ada satu hal yang sampai sekarang masih menjadi misteri. Bagaimana mungkin dua orang menghilang begitu saja, tanpa meninggalkan satu pun petunjuk?" \
            --write-media output/ardi-test.mp3

      - name: Verify Audio
        run: |
          test -s output/ardi-test.mp3
          ls -lh output/ardi-test.mp3

      - name: Upload Voice Audio
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-ardi-voice
          path: output/ardi-test.mp3
