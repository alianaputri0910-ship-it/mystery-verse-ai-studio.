name: MYSTERY VERSE - Production Validation
on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Episode folder, e.g. episode-001"
        required: true
        default: "episode-001"
        type: string
permissions:
  contents: read
jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate script and storyboard
        run: node scripts/validate-episode.mjs "${{ inputs.episode_id }}" --stage=production
